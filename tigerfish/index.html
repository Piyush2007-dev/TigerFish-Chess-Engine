<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TigerFish Chess</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Board fills height minus two player bars (44px each) and some padding.
       Also constrain so side panel (220px + 20px gap) fits horizontally. */
    --bar-h: 44px;
    --panel-w: 220px;
    --gap: 16px;
    --board: min(
      calc(100vh - var(--bar-h) * 2 - 8px),
      calc(100vw - var(--panel-w) - var(--gap) - 12px)
    );
    --sq: calc(var(--board) / 8);
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #1a1a1a;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ddd;
  }

  .app {
    display: flex;
    align-items: center;
    gap: var(--gap);
  }

  /* ── Board column ── */
  .board-col {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: var(--board);
  }

  .player-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #2a2a2a;
    border: 2px solid #111;
    padding: 6px 10px;
    width: var(--board);
    height: var(--bar-h);
    border-bottom: none;
  }
  .player-bar.bottom { border-top: none; border-bottom: 2px solid #111; }
  .player-name { font-size: clamp(12px, 1.4vw, 16px); font-weight: 600; letter-spacing: 0.5px; }
  .clock {
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    color: #eee;
    background: #111;
    padding: 4px 10px;
    border-radius: 2px;
    min-width: 68px;
    text-align: center;
  }
  .clock.active { background: #c8a96e; color: #111; }

  /* ── Chessboard ── */
  .board-wrap {
    border: 6px solid #111;
    display: block;
    line-height: 0;
    width: var(--board);
    height: var(--board);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, var(--sq));
    grid-template-rows: repeat(8, var(--sq));
    width: var(--board);
    height: var(--board);
  }

  .sq {
    width: var(--sq);
    height: var(--sq);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    user-select: none;
  }
  .sq.light { background: #f2dfc9; }
  .sq.dark  { background: #b7896d; }

  .sq.selected  { background: #f6f669 !important; }
  .sq.last-from { background: rgba(205, 209, 106, 0.45) !important; }
  .sq.last-to   { background: rgba(205, 209, 106, 0.85) !important; }

  /* Legal move dot */
  .sq.legal::after {
    content: '';
    position: absolute;
    width: calc(var(--sq) * 0.35);
    height: calc(var(--sq) * 0.35);
    border-radius: 50%;
    background: rgba(0,0,0,0.22);
    pointer-events: none;
  }
  /* Legal capture ring */
  .sq.legal-cap::after {
    content: '';
    position: absolute;
    inset: 0;
    border: calc(var(--sq) * 0.09) solid rgba(0,0,0,0.22);
    pointer-events: none;
  }

  .sq img {
    width: calc(var(--sq) * 0.88);
    height: calc(var(--sq) * 0.88);
    display: block;
    pointer-events: none;
  }

  .board-outer { position: relative; }

  /* ── Side panel ── */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: var(--panel-w);
    align-self: center;
  }

  .status-box {
    background: #2a2a2a;
    border: 1px solid #444;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
    border-radius: 2px;
  }
  .status-box .label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-box .value { font-weight: 600; color: #eee; }

  .select-control {
    background: #1e1e1e;
    border: 1px solid #555;
    color: #eee;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 2px;
    width: 100%;
    margin-top: 5px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .select-control:focus {
    border-color: #c8a96e;
  }
  .select-control:hover {
    background: #252525;
  }

  .btn {
    background: #2a2a2a;
    border: 1px solid #555;
    color: #ccc;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 2px;
    width: 100%;
    text-align: left;
    transition: background 0.15s;
  }
  .btn:hover { background: #383838; }
  .btn.danger { border-color: #a04040; color: #e07070; }
  .btn.danger:hover { background: #3a2020; }

  /* History dropdown */
  .history-wrap { position: relative; }
  .history-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-btn .arrow { font-size: 10px; color: #888; }
  .history-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #222;
    border: 1px solid #555;
    border-top: none;
    max-height: 220px;
    overflow-y: auto;
    z-index: 10;
  }
  .history-dropdown.open { display: block; }
  .history-entry {
    display: flex;
    gap: 4px;
    padding: 4px 10px;
    font-size: 12px;
    border-bottom: 1px solid #2f2f2f;
  }
  .history-entry .num { color: #666; min-width: 22px; }
  .history-entry .white-move { color: #ddd; min-width: 52px; }
  .history-entry .black-move { color: #aaa; }

  /* ── Promotion modal ── */
  #promo-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #promo-modal.show { display: flex; }
  .promo-box {
    background: #2a2a2a;
    border: 2px solid #555;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .promo-box p { font-size: 14px; color: #ccc; }
  .promo-pieces { display: flex; gap: 8px; }
  .promo-btn {
    background: #f2dfc9;
    border: 2px solid #b7896d;
    width: 64px;
    height: 64px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    transition: background 0.15s;
  }
  .promo-btn:hover { background: #e8c8a8; }
  .promo-btn svg { width: 52px; height: 52px; }

  /* Game over banner */
  #game-banner {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a1a;
    border: 2px solid #b7896d;
    padding: 24px 40px;
    z-index: 50;
    text-align: center;
  }
  #game-banner h2 { font-size: 20px; color: #f2dfc9; margin-bottom: 8px; }
  #game-banner p  { font-size: 14px; color: #aaa; }

  /* Captured pieces and material score styling */
  .player-info-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .captured-box {
    display: flex;
    align-items: center;
    height: 16px;
    gap: 1px;
  }
  .captured-piece-img {
    width: 20px;
    height: 20px;
    opacity: 0.85;
    display: inline-block;
    vertical-align: middle;
    margin-right: -4px;
  }
  .material-diff {
    font-size: 11px;
    font-weight: 700;
    color: #eee;
    background: #3e3e3e;
    padding: 2px 5px;
    border-radius: 3px;
    margin-left: 6px;
    display: inline-block;
    vertical-align: middle;
    line-height: 1;
    border: 1px solid #4f4f4f;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  /* History navigation and active move styling */
  .clickable {
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 2px;
    transition: background 0.15s, color 0.15s;
  }
  .clickable:hover {
    background: #383838;
    color: #c8a96e !important;
  }
  .clickable.active-view {
    background: #c8a96e;
    color: #111 !important;
  }

  /* History navigation buttons row below board */
  .nav-btn-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    width: var(--board);
  }
  .nav-btn {
    background: #2a2a2a;
    border: 1px solid #555;
    color: #eee;
    padding: 5px 12px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, border-color 0.15s;
    flex: 1;
    max-width: 60px;
    text-align: center;
    user-select: none;
  }
  .nav-btn:hover {
    background: #383838;
    border-color: #888;
  }
  /* Order properties for column swapping when board is flipped */
  #bar-black { order: 1; }
  .board-outer { order: 2; }
  .nav-btn-row { order: 3; }
  #bar-white { order: 4; }

  .board-col.flipped-layout #bar-black {
    order: 4;
    border-top: none;
    border-bottom: 2px solid #111;
  }
  .board-col.flipped-layout #bar-white {
    order: 1;
    border-bottom: none;
    border-top: 2px solid #111;
  }

  /* Board rotation style */
  #board {
  }
  #board.flipped {
    transform: rotate(180deg);
  }
  #board.flipped .sq img {
    transform: rotate(180deg);
  }
</style>
</head>
<body>

<div class="app">
  <!-- Board column -->
  <div class="board-col">
    <div class="player-bar" id="bar-black">
      <div class="player-info-wrap">
        <span class="player-name">Black</span>
        <div class="captured-box" id="captured-black"></div>
      </div>
      <span class="clock" id="clock-black">10:00</span>
    </div>
    <div class="board-outer">
      <div class="board-wrap">
        <div id="board"></div>
      </div>
    </div>
    <div class="nav-btn-row">
      <button class="nav-btn" onclick="navHistory('first')">⏮</button>
      <button class="nav-btn" onclick="navHistory('prev')">◀</button>
      <button class="nav-btn" onclick="navHistory('next')">▶</button>
      <button class="nav-btn" onclick="navHistory('last')">⏭</button>
    </div>
    <div class="player-bar bottom" id="bar-white">
      <div class="player-info-wrap">
        <span class="player-name">White</span>
        <div class="captured-box" id="captured-white"></div>
      </div>
      <span class="clock active" id="clock-white">10:00</span>
    </div>
  </div>

  <!-- Side panel -->
  <div class="side-panel">
    <div class="status-box">
      <div class="label">Turn</div>
      <div class="value" id="status-turn">White to move</div>
    </div>
    <div class="status-box" id="status-check-box" style="display:none">
      <div class="value" style="color:#e07070">⚠ Check!</div>
    </div>

    <div class="status-box">
      <div class="label">Game Mode</div>
      <select id="mode-select" class="select-control" onchange="onModeChange()">
        <option value="computer">💻 vs Computer</option>
        <option value="2p">👥 Local 2 Players</option>
      </select>
    </div>

    <div class="status-box" id="difficulty-box">
      <div class="label">Computer Level</div>
      <select id="depth-select" class="select-control" onchange="onDepthChange()">
        <option value="3">Easy (Depth 3)</option>
        <option value="4">Medium (Depth 4)</option>
        <option value="5" selected>Hard (Depth 5)</option>
        <option value="6">Master (Depth 6)</option>
      </select>
    </div>

    <div class="history-wrap">
      <button class="btn history-btn" id="history-toggle-btn" onclick="toggleHistory()">
        <span>Move History</span>
        <span class="arrow" id="history-arrow">▼</span>
      </button>
      <div class="history-dropdown" id="history-dropdown"></div>
    </div>

    <button class="btn" onclick="undoMove()">↩ Undo Move</button>
    <button class="btn danger" onclick="newGame()">⟳ New Game</button>
  </div>
</div>

<!-- Promotion modal -->
<div id="promo-modal">
  <div class="promo-box">
    <p>Choose promotion piece</p>
    <div class="promo-pieces" id="promo-pieces"></div>
  </div>
</div>

<!-- Game over banner -->
<div id="game-banner">
  <h2 id="banner-title"></h2>
  <p id="banner-sub"></p>
</div>

<script>
// ══════════════════════════════════════════════════
// SVG Pieces (inline, outline style matching the image)
// Using Wikipedia/Wikimedia standard chess SVGs
// ══════════════════════════════════════════════════

const SVG_BASE = 'https://upload.wikimedia.org/wikipedia/commons';

const PIECE_SVG = {
  // White pieces
  'K': `${SVG_BASE}/4/42/Chess_klt45.svg`,
  'Q': `${SVG_BASE}/1/15/Chess_qlt45.svg`,
  'R': `${SVG_BASE}/7/72/Chess_rlt45.svg`,
  'B': `${SVG_BASE}/b/b1/Chess_blt45.svg`,
  'N': `${SVG_BASE}/7/70/Chess_nlt45.svg`,
  'P': `${SVG_BASE}/4/45/Chess_plt45.svg`,
  // Black pieces
  'k': `${SVG_BASE}/f/f0/Chess_kdt45.svg`,
  'q': `${SVG_BASE}/4/47/Chess_qdt45.svg`,
  'r': `${SVG_BASE}/f/ff/Chess_rdt45.svg`,
  'b': `${SVG_BASE}/9/98/Chess_bdt45.svg`,
  'n': `${SVG_BASE}/e/ef/Chess_ndt45.svg`,
  'p': `${SVG_BASE}/c/c7/Chess_pdt45.svg`,
};

// ══════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════

const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

let currentFen   = START_FEN;
let currentState = null;   // last /api/state response
let selectedSq   = null;   // index 0-63 of selected square
let legalTargets = [];     // UCI strings of legal moves for selected piece
let lastMove     = null;   // {from, to}
let moveHistory  = [];     // array of {white, black} pairs
let halfMoveList = [];     // raw UCI moves played
let pendingPromo = null;   // {from, to} awaiting promotion choice

// Clocks (seconds)
let whiteTime = 600, blackTime = 600;
let clockInterval = null;
let side = 'white'; // whose turn

// Game mode, AI depth settings, and board state history
let gameMode = 'computer';
let searchDepth = 5;
let boardHistory = [];      // Array of historical board states {fen, grid, side, status, in_check, moves, lastMove}
let viewingMoveIndex = -1;  // Pointer for history navigation (-1 means latest)

function onModeChange() {
  const mode = document.getElementById('mode-select').value;
  gameMode = mode;
  const diffBox = document.getElementById('difficulty-box');
  const blackNameEl = document.querySelector('#bar-black .player-name');
  const whiteNameEl = document.querySelector('#bar-white .player-name');

  if (mode === 'computer') {
    diffBox.style.display = 'block';
    if (whiteNameEl) whiteNameEl.textContent = 'White';
    if (blackNameEl) blackNameEl.textContent = 'TigerFish (Computer)';
  } else {
    diffBox.style.display = 'none';
    if (whiteNameEl) whiteNameEl.textContent = 'White (Player 1)';
    if (blackNameEl) blackNameEl.textContent = 'Black (Player 2)';
  }
  updateBoardOrientation(side);
}

function onDepthChange() {
  searchDepth = parseInt(document.getElementById('depth-select').value);
}

// Chess.com style material display
function updateMaterialDisplay() {
  const pieceValues = {
    'P': 1, 'N': 3, 'B': 3, 'R': 5, 'Q': 9,
    'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9
  };
  const startCounts = {
    'P': 8, 'N': 2, 'B': 2, 'R': 2, 'Q': 1,
    'p': 8, 'n': 2, 'b': 2, 'r': 2, 'q': 1
  };
  let currentCounts = {
    'P': 0, 'N': 0, 'B': 0, 'R': 0, 'Q': 0,
    'p': 0, 'n': 0, 'b': 0, 'r': 0, 'q': 0
  };
  
  let whiteValue = 0;
  let blackValue = 0;
  
  const state = (viewingMoveIndex !== -1) ? boardHistory[viewingMoveIndex] : boardHistory[boardHistory.length - 1];
  if (!state) return;
  const grid = state.grid;
  
  for (let i = 0; i < 64; i++) {
    const p = grid[i];
    if (p && p !== '.') {
      currentCounts[p]++;
      if (p === p.toUpperCase()) {
        whiteValue += pieceValues[p];
      } else {
        blackValue += pieceValues[p];
      }
    }
  }

  // Calculate dead counts for each side
  const deadCounts = {
    'P': startCounts['P'] - currentCounts['P'],
    'N': startCounts['N'] - currentCounts['N'],
    'B': startCounts['B'] - currentCounts['B'],
    'R': startCounts['R'] - currentCounts['R'],
    'Q': startCounts['Q'] - currentCounts['Q'],
    'p': startCounts['p'] - currentCounts['p'],
    'n': startCounts['n'] - currentCounts['n'],
    'b': startCounts['b'] - currentCounts['b'],
    'r': startCounts['r'] - currentCounts['r'],
    'q': startCounts['q'] - currentCounts['q']
  };

  // Calculate net captures for each player (cancelling out identical pieces)
  // White captured Black pieces (lowercase, bottom bar)
  let whiteCaptures = [];
  const blackOrder = ['q', 'r', 'b', 'n', 'p'];
  blackOrder.forEach(p => {
    const equivalentWhite = p.toUpperCase();
    const net = Math.max(0, deadCounts[p] - deadCounts[equivalentWhite]);
    for (let d = 0; d < net; d++) whiteCaptures.push(p);
  });

  // Black captured White pieces (uppercase, top bar)
  let blackCaptures = [];
  const whiteOrder = ['Q', 'R', 'B', 'N', 'P'];
  whiteOrder.forEach(p => {
    const equivalentBlack = p.toLowerCase();
    const net = Math.max(0, deadCounts[p] - deadCounts[equivalentBlack]);
    for (let d = 0; d < net; d++) blackCaptures.push(p);
  });

  let whiteCapturesHtml = getCapturedHtml(whiteCaptures);
  let blackCapturesHtml = getCapturedHtml(blackCaptures);

  if (whiteValue > blackValue) {
    whiteCapturesHtml += `<span class="material-diff">+${whiteValue - blackValue}</span>`;
  } else if (blackValue > whiteValue) {
    blackCapturesHtml += `<span class="material-diff">+${blackValue - whiteValue}</span>`;
  }

  document.getElementById('captured-white').innerHTML = whiteCapturesHtml;
  document.getElementById('captured-black').innerHTML = blackCapturesHtml;
}

function getCapturedHtml(piecesList) {
  let html = '';
  piecesList.forEach(p => {
    html += `<img src="${PIECE_SVG[p]}" class="captured-piece-img" />`;
  });
  return html;
}

// History browsing and jumping
function jumpToHistoryState(idx) {
  if (idx < 0 || idx >= boardHistory.length) return;
  viewingMoveIndex = idx;
  
  const state = boardHistory[viewingMoveIndex];
  renderBoard(state.grid);
  lastMove = state.lastMove;
  
  const turnEl = document.getElementById('status-turn');
  if (viewingMoveIndex === boardHistory.length - 1) {
    turnEl.textContent = state.side === 'white' ? 'White to move' : 'Black to move';
    updateClockSide(state.side);
  } else {
    // Show navigation feedback status
    const moveDesc = (viewingMoveIndex % 2 === 0) ? "Black's turn" : "White's turn";
    turnEl.textContent = `Viewing move ${viewingMoveIndex} / ${boardHistory.length - 1} (${moveDesc})`;
    document.getElementById('clock-white').classList.remove('active');
    document.getElementById('clock-black').classList.remove('active');
  }
  
  updateMaterialDisplay();
  highlightActiveHistoryMove();
}

function highlightActiveHistoryMove() {
  const elements = document.querySelectorAll('.history-entry span.clickable');
  elements.forEach(el => el.classList.remove('active-view'));

  if (viewingMoveIndex === -1 || viewingMoveIndex === boardHistory.length - 1 || viewingMoveIndex === 0) return;
  
  if (gameMode === 'computer') {
    const rows = document.querySelectorAll('.history-entry');
    rows.forEach(row => {
      const numSpan = row.querySelector('.num');
      if (numSpan) {
        const turnNum = parseInt(numSpan.textContent);
        if (turnNum === viewingMoveIndex) {
          const wMove = row.querySelector('.white-move');
          if (wMove) wMove.classList.add('active-view');
        }
      }
    });
  } else {
    const turnNum = Math.ceil(viewingMoveIndex / 2);
    const isWhite = (viewingMoveIndex % 2 === 1);
    const rows = document.querySelectorAll('.history-entry');
    rows.forEach(row => {
      const numSpan = row.querySelector('.num');
      if (numSpan) {
        const t = parseInt(numSpan.textContent);
        if (t === turnNum) {
          const moveSpan = isWhite ? row.querySelector('.white-move') : row.querySelector('.black-move');
          if (moveSpan) moveSpan.classList.add('active-view');
        }
      }
    });
  }
}

function navHistory(direction) {
  if (boardHistory.length <= 1) return;
  
  let targetIdx = viewingMoveIndex;
  if (targetIdx === -1) targetIdx = boardHistory.length - 1;
  
  if (direction === 'first') {
    targetIdx = 0;
  } else if (direction === 'prev') {
    targetIdx = Math.max(0, targetIdx - 1);
  } else if (direction === 'next') {
    targetIdx = Math.min(boardHistory.length - 1, targetIdx + 1);
  } else if (direction === 'last') {
    targetIdx = boardHistory.length - 1;
  }
  
  jumpToHistoryState(targetIdx);
}

// Arrow keys navigation
window.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if (e.key === 'ArrowLeft') {
    navHistory('prev');
  } else if (e.key === 'ArrowRight') {
    navHistory('next');
  }
});

// ══════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════

window.addEventListener('load', () => {
  buildBoard();
  fetchState(START_FEN);
  startClock();
  onModeChange();
});

// ══════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════

async function fetchState(fen) {
  try {
    const r = await fetch(`/api/state?fen=${encodeURIComponent(fen)}`);
    const data = await r.json();
    currentState = data;
    currentFen   = data.fen;
    side = data.side;

    // Initialize board state history on initial load
    if (boardHistory.length === 0) {
      boardHistory.push({
        fen: data.fen,
        grid: data.grid,
        side: data.side,
        status: data.status,
        in_check: data.in_check,
        moves: data.moves,
        lastMove: null
      });
      viewingMoveIndex = -1;
    }

    renderBoard(data.grid);
    updateStatus(data);
    updateMaterialDisplay();
  } catch(e) {
    console.error('fetchState error', e);
  }
}

async function sendMove(uci) {
  try {
    // 1. Optimistic Board Update for Player's Move
    const fromIdx = uciFrom(uci);
    const toIdx = uciTo(uci);
    let gridArr = currentState.grid.split('');
    let movingPiece = gridArr[fromIdx];

    // Handle Pawn Promotion
    if (uci.length === 5) {
      const promoChar = uci[4];
      movingPiece = (movingPiece === movingPiece.toUpperCase()) ? promoChar.toUpperCase() : promoChar.toLowerCase();
    }

    // Handle En Passant
    if ((movingPiece === 'P' || movingPiece === 'p') && currentState.grid[toIdx] === '.') {
      const fromFile = fromIdx % 8;
      const toFile = toIdx % 8;
      if (fromFile !== toFile) {
        const capIdx = (movingPiece === 'P') ? toIdx - 8 : toIdx + 8;
        gridArr[capIdx] = '.';
      }
    }

    // Handle Castling
    if (movingPiece === 'K' && fromIdx === 4) {
      if (toIdx === 6) { gridArr[7] = '.'; gridArr[5] = 'R'; }
      else if (toIdx === 2) { gridArr[0] = '.'; gridArr[3] = 'R'; }
    } else if (movingPiece === 'k' && fromIdx === 60) {
      if (toIdx === 62) { gridArr[63] = '.'; gridArr[61] = 'r'; }
      else if (toIdx === 58) { gridArr[56] = '.'; gridArr[59] = 'r'; }
    }

    // Apply main move
    gridArr[fromIdx] = '.';
    gridArr[toIdx] = movingPiece;
    const optimisticGrid = gridArr.join('');

    // Update board UI instantly
    lastMove = { from: fromIdx, to: toIdx };
    renderBoard(optimisticGrid);

    // Switch clock to opponent and show status immediately while engine is thinking
    const opponentSide = (side === 'white') ? 'black' : 'white';
    updateClockSide(opponentSide);
    if (gameMode === 'computer') {
      document.getElementById('status-turn').textContent = 'TigerFish is thinking...';
    } else {
      document.getElementById('status-turn').textContent = 'Processing...';
    }

    // 2. Perform Network Request in Background
    const r = await fetch('/api/move', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ fen: currentFen, move: uci, depth: (gameMode === '2p' ? 0 : searchDepth) })
    });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();

    // 3. Final Board Update after Response
    currentState = data;
    currentFen   = data.fen;

    // Record player's move in history
    halfMoveList.push(uci);
    addToHistory(uci, halfMoveList.length);

    // Record bot's move if one was computed
    if (data.bot_move) {
      halfMoveList.push(data.bot_move);
      addToHistory(data.bot_move, halfMoveList.length);
      lastMove = { from: uciFrom(data.bot_move), to: uciTo(data.bot_move) };
    } else {
      lastMove = { from: fromIdx, to: toIdx };
    }

    // Push final state of this turn to boardHistory
    boardHistory.push({
      fen: data.fen,
      grid: data.grid,
      side: data.side,
      status: data.status,
      in_check: data.in_check,
      moves: data.moves,
      lastMove: lastMove
    });
    viewingMoveIndex = -1;

    side = data.side;
    renderBoard(data.grid);
    updateStatus(data);
    updateMaterialDisplay();
    selectedSq = null;
    legalTargets = [];
  } catch(e) {
    console.error('sendMove error', e);
    // Rollback to correct state if network or server fails
    if (currentState) {
      renderBoard(currentState.grid);
      updateStatus(currentState);
    }
  }
}

// ══════════════════════════════════════════════════
// Board rendering
// ══════════════════════════════════════════════════

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  // Visual rank 8 → rank 1 (row 0 = rank 8, row 7 = rank 1)
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const sq = document.createElement('div');
      const light = (row + col) % 2 === 0;
      sq.className = 'sq ' + (light ? 'light' : 'dark');
      // Index in grid: rank = 7-row, file = col → sq_idx = rank*8 + file
      const sqIdx = (7 - row) * 8 + col;
      sq.dataset.idx = sqIdx;
      sq.addEventListener('click', () => onSquareClick(sqIdx));
      board.appendChild(sq);
    }
  }
}

function renderBoard(grid) {
  // grid: 64-char string, index 0=a1, 7=h1, 56=a8, 63=h8
  const squares = document.querySelectorAll('.sq');
  squares.forEach(sq => {
    const idx = parseInt(sq.dataset.idx);
    const piece = grid[idx];

    // Clear classes
    sq.className = 'sq ' + (isLight(idx) ? 'light' : 'dark');

    // Highlights
    if (idx === selectedSq) sq.classList.add('selected');
    if (lastMove) {
      if (idx === lastMove.from) sq.classList.add('last-from');
      if (idx === lastMove.to)   sq.classList.add('last-to');
    }

    // Legal move indicators
    if (legalTargets.includes(idx)) {
      if (piece && piece !== '.') {
        sq.classList.add('legal-cap');
      } else {
        sq.classList.add('legal');
      }
    }

    // Piece image
    sq.innerHTML = '';
    if (piece && piece !== '.') {
      const img = document.createElement('img');
      img.src = PIECE_SVG[piece];
      img.style.cssText = 'display:block;pointer-events:none;';
      img.draggable = false;
      sq.appendChild(img);
    }
  });

  // Flip/unflip board according to whose turn it is in the active state
  updateBoardOrientation(side);
}

function updateBoardOrientation(sideToMove) {
  const boardEl = document.getElementById('board');
  const boardCol = document.querySelector('.board-col');
  if (gameMode === '2p' && sideToMove === 'black') {
    if (boardEl) boardEl.classList.add('flipped');
    if (boardCol) boardCol.classList.add('flipped-layout');
  } else {
    if (boardEl) boardEl.classList.remove('flipped');
    if (boardCol) boardCol.classList.remove('flipped-layout');
  }
}

function isLight(idx) {
  const rank = Math.floor(idx / 8);
  const file = idx % 8;
  return (rank + file) % 2 !== 0;
}

// ══════════════════════════════════════════════════
// Interaction
// ══════════════════════════════════════════════════

function onSquareClick(idx) {
  // Disable interaction if viewing history
  if (viewingMoveIndex !== -1 && viewingMoveIndex !== boardHistory.length - 1) {
    return;
  }

  if (!currentState || currentState.status !== 'ongoing') return;

  const grid = currentState.grid;
  const piece = grid[idx];
  const isMyPiece = piece && piece !== '.' &&
    ((side === 'white' && piece === piece.toUpperCase()) ||
     (side === 'black' && piece === piece.toLowerCase()));

  // If clicking a legal target square
  if (legalTargets.includes(idx) && selectedSq !== null) {
    const fromUCI = sqToAlg(selectedSq);
    const toUCI   = sqToAlg(idx);
    const uci     = fromUCI + toUCI;

    // Check if any matching move is a promotion
    const promoMoves = currentState.moves.filter(m =>
      m.startsWith(uci) && m.length === 5);

    if (promoMoves.length > 0) {
      openPromoModal(selectedSq, idx);
      return;
    }

    selectedSq = null;
    legalTargets = [];
    sendMove(uci);
    return;
  }

  // Select own piece
  if (isMyPiece) {
    selectedSq = idx;
    const alg = sqToAlg(idx);
    legalTargets = currentState.moves
      .filter(m => m.startsWith(alg))
      .map(m => algTo(m.slice(2, 4)));
    renderBoard(grid);
    return;
  }

  // Deselect
  selectedSq = null;
  legalTargets = [];
  renderBoard(grid);
}

// ══════════════════════════════════════════════════
// Promotion
// ══════════════════════════════════════════════════

function openPromoModal(from, to) {
  pendingPromo = { from, to };
  const container = document.getElementById('promo-pieces');
  container.innerHTML = '';
  const isWhite = side === 'white';
  const pieces = isWhite ? ['Q','R','B','N'] : ['q','r','b','n'];
  pieces.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'promo-btn';
    const img = document.createElement('img');
    img.src = PIECE_SVG[p];
    img.style.cssText = 'width:52px;height:52px;display:block;pointer-events:none;';
    btn.appendChild(img);
    btn.addEventListener('click', () => {
      closePromoModal();
      const uci = sqToAlg(from) + sqToAlg(to) + p.toLowerCase();
      selectedSq = null;
      legalTargets = [];
      sendMove(uci);
    });
    container.appendChild(btn);
  });
  document.getElementById('promo-modal').classList.add('show');
}

function closePromoModal() {
  document.getElementById('promo-modal').classList.remove('show');
  pendingPromo = null;
}

// ══════════════════════════════════════════════════
// Status & UI updates
// ══════════════════════════════════════════════════

function updateStatus(data) {
  const turnEl  = document.getElementById('status-turn');
  const checkEl = document.getElementById('status-check-box');
  const banner  = document.getElementById('game-banner');
  const bTitle  = document.getElementById('banner-title');
  const bSub    = document.getElementById('banner-sub');

  banner.style.display = 'none';
  checkEl.style.display = 'none';

  const s = data.status;
  if (s === 'ongoing') {
    turnEl.textContent = data.side === 'white' ? 'White to move' : 'Black to move';
    if (data.in_check) checkEl.style.display = 'block';
    updateClockSide(data.side);
  } else {
    stopClock();
    let title = '', sub = '';
    if (s === 'checkmate') {
      const winner = data.side === 'white' ? 'Black' : 'White';
      title = `${winner} wins by Checkmate!`;
    } else if (s === 'stalemate') {
      title = 'Draw by Stalemate';
    } else if (s === 'fifty_move') {
      title = 'Draw — 50 Move Rule';
    } else if (s === 'seventy_five_move') {
      title = 'Draw — 75 Move Rule';
    } else if (s === 'insufficient_material') {
      title = 'Draw — Insufficient Material';
    }
    turnEl.textContent = title;
    bTitle.textContent = title;
    bSub.textContent = '';
    banner.style.display = 'block';
    setTimeout(() => banner.style.display = 'none', 4000);
  }
}

// ══════════════════════════════════════════════════
// Clocks
// ══════════════════════════════════════════════════

function startClock() {
  clockInterval = setInterval(() => {
    if (side === 'white') {
      whiteTime = Math.max(0, whiteTime - 1);
    } else {
      blackTime = Math.max(0, blackTime - 1);
    }
    renderClocks();
  }, 1000);
}

function stopClock() {
  clearInterval(clockInterval);
}

function updateClockSide(newSide) {
  side = newSide;
  const wClock = document.getElementById('clock-white');
  const bClock = document.getElementById('clock-black');
  if (newSide === 'white') {
    wClock.classList.add('active');
    bClock.classList.remove('active');
  } else {
    bClock.classList.add('active');
    wClock.classList.remove('active');
  }
}

function renderClocks() {
  document.getElementById('clock-white').textContent = formatTime(whiteTime);
  document.getElementById('clock-black').textContent = formatTime(blackTime);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// ══════════════════════════════════════════════════
// Move History
// ══════════════════════════════════════════════════

function addToHistory(uci, halfMoveNum) {
  const moveNum = Math.ceil(halfMoveNum / 2);
  const isWhiteMove = (halfMoveNum % 2 === 1);

  if (isWhiteMove) {
    moveHistory.push({ num: moveNum, white: uci, black: null });
  } else {
    if (moveHistory.length > 0) {
      moveHistory[moveHistory.length - 1].black = uci;
    }
  }
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history-dropdown');
  el.innerHTML = '';
  [...moveHistory].reverse().forEach(entry => {
    const whiteHistoryIdx = (entry.num - 1) * 2;
    const blackHistoryIdx = (entry.num - 1) * 2 + 1;

    let whiteClick = '';
    let blackClick = '';

    if (gameMode === 'computer') {
      const bhIdx = entry.num;
      whiteClick = `onclick="jumpToHistoryState(${bhIdx})"`;
      blackClick = `onclick="jumpToHistoryState(${bhIdx})"`;
    } else {
      const bhIdxWhite = whiteHistoryIdx + 1;
      const bhIdxBlack = blackHistoryIdx + 1;
      whiteClick = `onclick="jumpToHistoryState(${bhIdxWhite})"`;
      if (entry.black) {
        blackClick = `onclick="jumpToHistoryState(${bhIdxBlack})"`;
      }
    }

    const row = document.createElement('div');
    row.className = 'history-entry';
    row.innerHTML = `
      <span class="num">${entry.num}.</span>
      <span class="white-move clickable" ${whiteClick}>${entry.white}</span>
      <span class="black-move clickable" ${blackClick}>${entry.black || ''}</span>
    `;
    el.appendChild(row);
  });
}

function toggleHistory() {
  const dd = document.getElementById('history-dropdown');
  const arrow = document.getElementById('history-arrow');
  dd.classList.toggle('open');
  arrow.textContent = dd.classList.contains('open') ? '▲' : '▼';
}

// ══════════════════════════════════════════════════
// Undo
// ══════════════════════════════════════════════════

function undoMove() {
  if (halfMoveList.length === 0 || boardHistory.length <= 1) return;

  if (gameMode === 'computer') {
    // Pop both the bot's response and the player's move
    if (halfMoveList.length >= 2) {
      halfMoveList.pop();
      halfMoveList.pop();
      boardHistory.pop();
      moveHistory.pop();
    } else {
      halfMoveList.pop();
      boardHistory.pop();
      moveHistory.pop();
    }
  } else {
    // 2P Mode: Pop just the last single move
    halfMoveList.pop();
    boardHistory.pop();
    if (moveHistory.length > 0) {
      const last = moveHistory[moveHistory.length - 1];
      if (last.black) {
        last.black = null;
      } else {
        moveHistory.pop();
      }
    }
  }
  renderHistory();

  // Get the state at the end of the history
  viewingMoveIndex = boardHistory.length - 1;
  const state = boardHistory[viewingMoveIndex];
  
  // Set current FEN and state back to this historical state
  currentFen = state.fen;
  currentState = {
    fen: state.fen,
    grid: state.grid,
    side: state.side,
    status: state.status,
    in_check: state.in_check,
    moves: state.moves
  };
  side = state.side;
  lastMove = state.lastMove;
  selectedSq = null;
  legalTargets = [];
  
  renderBoard(state.grid);
  updateStatus(currentState);
  updateMaterialDisplay();
}

// ══════════════════════════════════════════════════
// New Game
// ══════════════════════════════════════════════════

function newGame() {
  currentFen   = START_FEN;
  selectedSq   = null;
  legalTargets = [];
  lastMove     = null;
  moveHistory  = [];
  halfMoveList = [];
  boardHistory = [];
  viewingMoveIndex = -1;
  whiteTime    = 600;
  blackTime    = 600;
  side         = 'white';
  renderHistory();
  stopClock();
  startClock();
  fetchState(START_FEN);
  document.getElementById('game-banner').style.display = 'none';
  document.getElementById('history-dropdown').classList.remove('open');
  document.getElementById('history-arrow').textContent = '▼';
  updateClockSide('white');
  onModeChange();
}

// ══════════════════════════════════════════════════
// Coordinate helpers
// ══════════════════════════════════════════════════

// sq index (0=a1, 63=h8) → algebraic string "e2"
function sqToAlg(idx) {
  const file = idx % 8;
  const rank = Math.floor(idx / 8);
  return String.fromCharCode(97 + file) + (rank + 1);
}

// UCI move "e2e4" → from index
function uciFrom(uci) { return algTo(uci.slice(0, 2)); }
function uciTo(uci)   { return algTo(uci.slice(2, 4)); }

// algebraic "e2" → sq index
function algTo(alg) {
  const file = alg.charCodeAt(0) - 97;
  const rank = parseInt(alg[1]) - 1;
  return rank * 8 + file;
}
